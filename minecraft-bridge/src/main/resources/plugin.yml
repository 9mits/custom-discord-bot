name: MGXAccessBridge
version: ${version}
main: bot.mgx.accessbridge.MGXAccessBridge
api-version: "1.20"
description: Signed Minecraft access, Discord perks, scoreboard, and clans.
authors: [9mits]
depend: [floodgate]
commands:
  clans:
    description: Create and manage Minecraft clans.
    usage: /clans help
    aliases: [clan]
permissions:
  mgx.clans:
    description: Allows players to use the clan system.
    default: true
