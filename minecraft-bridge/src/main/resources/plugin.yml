name: MGXAccessBridge
version: ${version}
main: bot.mgx.accessbridge.MGXAccessBridge
api-version: "1.21"
description: Signed Minecraft access, Discord chat and perks, scoreboard, and clans.
authors: [9mits]
depend: [floodgate]
softdepend: [LuckPerms]
commands:
  clans:
    description: Create and manage Minecraft clans.
    usage: /clans help
    aliases: [clan]
  claninfo:
    description: Open a detailed clan information card.
    usage: /claninfo [name]
  guide:
    description: Open the Mysterious SMP X server guide.
    usage: /guide [levels|clans|commands|staff]
    aliases: [serverguide]
  perks:
    description: View Discord level milestones and Minecraft perks.
    usage: /perks
    aliases: [levels, levelperks]
  discord:
    description: Open the Mysterious SMP X Discord invite.
    usage: /discord
  discordnames:
    description: Show or hide your linked Discord username in Minecraft.
    usage: /discordnames
    aliases: [discordname]
  settings:
    description: Change what you see in chat, nametags and the player list.
    usage: /settings [clan_tags|discord_chat|discord_names]
    aliases: [mysettings, prefs]
  whitelisted:
    description: List everyone with whitelist access and their Discord name.
    usage: /whitelisted [page]
    aliases: [whitelistlist]
  mgxadmin:
    description: Hold players out of Discord rank sync, and reset accumulated data.
    usage: /mgxadmin <ranks|reset>
    permission: mgxaccessbridge.admin
permissions:
  mgx.clans:
    description: Allows players to use the clan system.
    default: true
  mgxaccessbridge.admin:
    description: Allows rank holds and administrative data resets.
    default: op
  mgxaccessbridge.maintenance.bypass:
    description: Allows joining while the server is held closed before launch.
    default: op
