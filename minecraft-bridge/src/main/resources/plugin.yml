name: MGXAccessBridge
version: ${version}
main: bot.mgx.accessbridge.MGXAccessBridge
api-version: "1.21"
description: Signed Minecraft access, Discord chat and perks, scoreboard, and clans.
authors: [9mits]
depend: [floodgate]
softdepend: [LuckPerms]
commands:
  clans:
    description: Create and manage Minecraft clans.
    usage: /clans help
    aliases: [clan]
    permission: mgx.clans
  claninfo:
    description: Open a detailed clan information card.
    usage: /claninfo [name]
  guide:
    description: Open the Mysterious SMP X server guide.
    usage: /guide [levels|clans|commands|staff]
    aliases: [serverguide]
  perks:
    description: View Discord level milestones and Minecraft perks.
    usage: /perks
    aliases: [levels, levelperks]
  discord:
    description: Open the Mysterious SMP X Discord invite.
    usage: /discord
  discordnames:
    description: Show or hide your linked Discord username in Minecraft.
    usage: /discordnames
    aliases: [discordname]
  settings:
    description: Change what you see in chat, nametags and the player list.
    usage: /settings [clan_tags|discord_chat|discord_names]
    aliases: [mysettings, prefs]
  whitelisted:
    description: List everyone with whitelist access and their Discord name.
    usage: /whitelisted [page]
    aliases: [whitelistlist]
  leaderboard:
    description: Open the richest and most-kills boards.
    usage: /leaderboard
    aliases: [lb, boards]
    permission: mgx.leaderboard
  shop:
    description: Open the server shop.
    usage: /shop
    aliases: [store]
    permission: mgx.shop
  sell:
    description: Sell items to the server.
    usage: /sell [hand|all]
    permission: mgx.shop
  ah:
    description: Open the auction house.
    usage: /ah [sell <price>|listings|expired|search <name>]
    aliases: [auction, auctionhouse]
    permission: mgx.auction
  bal:
    description: Show your money, or another online player's.
    usage: /bal [player]
    aliases: [balance, money]
    permission: mgx.shop
  pay:
    description: Send money to an online player.
    usage: /pay <player> <amount>
    permission: mgx.shop
  bounty:
    description: Put money on a player's head, or list active bounties.
    usage: /bounty [set <player> <amount>|clan <player> <amount>|list|check]
    aliases: [bounties]
    permission: mgx.shop
  mgxadmin:
    description: Hold players out of Discord rank sync, and reset accumulated data.
    usage: /mgxadmin <startserver|teststart|ranks|eco|hologram|reset>
    aliases: [mcadmin]
    permission: mgxaccessbridge.admin
permissions:
  mgx.clans:
    description: Allows players to use the clan system.
    default: true
  mgx.leaderboard:
    description: Allows players to open the in-game leaderboard.
    default: true
  mgx.shop:
    description: Allows players to use the shop, sell, balance and pay.
    default: true
  mgx.auction:
    description: Allows players to use the auction house.
    default: true
  mgxaccessbridge.admin:
    description: Allows rank holds, administrative data resets, and joining while the server is held for maintenance when granted explicitly in LuckPerms.
    default: false
