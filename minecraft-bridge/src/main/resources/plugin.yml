name: MGXAccessBridge
version: ${version}
main: bot.mgx.accessbridge.MGXAccessBridge
api-version: "1.21.11"
description: Signed access, economy, crates, cosmetics, scoreboard, and clans.
authors: [9mits]
depend: [floodgate]
softdepend: [LuckPerms, ViaVersion, Essentials]
commands:
  clans:
    description: Create and manage Minecraft clans.
    usage: /clans help
    aliases: [clan]
    permission: mgx.clans
  claninfo:
    description: Open a detailed clan information card.
    usage: /claninfo [name]
  guide:
    description: Open the Mysterious SMP X server guide.
    usage: /guide [levels|clans|commands|staff]
    aliases: [serverguide]
  perks:
    description: View Discord level milestones and Minecraft perks.
    usage: /perks
    aliases: [levels, levelperks]
  discord:
    description: Open the Mysterious SMP X Discord invite.
    usage: /discord
  discordnames:
    description: Show or hide your linked Discord username in Minecraft.
    usage: /discordnames
    aliases: [discordname]
  settings:
    description: Configure chat, notifications, cosmetics, privacy and scoreboard display.
    usage: /settings [setting]
    aliases: [mysettings, prefs]
  wardrobe:
    description: Equip the cosmetics you own and list them in the auction house.
    usage: /wardrobe [settings|kill_effects|auras|trails]
    aliases: [cosmetics]
    permission: mgx.cosmetics
  crate:
    description: Open Mysterious Crates, inspect exact odds and claim saved rewards.
    usage: /crate [open|odds|claim]
    aliases: [crates]
    permission: mgx.crate
  whitelisted:
    description: List everyone with whitelist access and their Discord name.
    usage: /whitelisted [page]
    aliases: [whitelistlist]
  leaderboard:
    description: Open the richest and most-kills boards.
    usage: /leaderboard
    aliases: [lb, boards]
    permission: mgx.leaderboard
  shop:
    description: Open the server shop.
    usage: /shop
    aliases: [store]
    permission: mgx.shop
  sell:
    description: Sell items to the server.
    usage: /sell [hand|all]
    permission: mgx.shop
  autosell:
    description: Sell anything the shop buys as soon as it reaches your inventory.
    usage: /autosell
    aliases: [autoselling]
    permission: mgx.shop
  autopay:
    description: Forward your money to another account on a timer.
    usage: /autopay [player] [amount|all] [seconds]
    aliases: [autopayment]
    permission: mgx.shop
  autobuy:
    description: Show or stop your standing shop order.
    usage: /autobuy [stop]
    permission: mgx.shop
  ah:
    description: Open the auction house.
    usage: /ah [sell <price>|listings|expired|search <name>]
    aliases: [auction, auctionhouse]
    permission: mgx.auction
  bal:
    description: Show your money, or another online player's.
    usage: /bal [player]
    aliases: [balance, money]
    permission: mgx.shop
  pay:
    description: Send money to an online player.
    usage: /pay <player> <amount>
    permission: mgx.shop
  bounty:
    description: Put money on a player's head, or list active bounties.
    usage: /bounty [set <player> <amount>|clan <player> <amount>|check]
    aliases: [bounties]
    permission: mgx.shop
  afk:
    description: Toggle your AFK status. Idle players are marked automatically.
    usage: /afk
    permission: mgx.afk
  rtp:
    description: Teleport to a safe random overworld location.
    usage: /rtp
    aliases: [tpr]
    permission: mgx.rtp
  mgxadmin:
    description: Give rewards, run events, hold rank sync, and reset data.
    usage: /mgxadmin <give|abuse|startserver|teststart|pvp|ranks|eco|bounty|hologram|serials|reset>
    aliases: [mcadmin]
    permission: mgxaccessbridge.admin
permissions:
  mgx.clans:
    description: Allows players to use the clan system.
    default: true
  mgx.leaderboard:
    description: Allows players to open the in-game leaderboard.
    default: true
  mgx.shop:
    description: Allows players to use the shop, sell, balance and pay.
    default: true
  mgx.auction:
    description: Allows players to use the auction house.
    default: true
  mgx.cosmetics:
    description: Allows players to use the wardrobe and cosmetic effects.
    default: true
  mgx.crate:
    description: Allows players to open crates and inspect their odds.
    default: true
  mgx.afk:
    description: Allows players to set and clear their AFK status.
    default: true
  mgx.rtp:
    description: Allows players to use random teleport.
    default: true
  mgxaccessbridge.admin:
    description: Allows rank holds, administrative data resets, and joining while the server is held for maintenance when granted explicitly in LuckPerms.
    default: false
