# Identifier expected by the dedicated Discord bot.
server-id: "mysterious-smp-x"

# Public WSS endpoint routed to the bot's MINECRAFT_BRIDGE_PORT and path.
bridge-url: "wss://replace-with-bot-host/minecraft-bridge"

# Generate with: openssl rand -hex 32
bridge-secret: "REPLACE_ME"

# Optional SHA-256 pin for direct WSS with a private certificate. Leave blank
# when using a normal publicly trusted certificate. The certificate must still
# match the bridge URL hostname or IP.
bridge-certificate-sha256: ""

# Keep false in production. When true, ws:// is accepted only for localhost.
allow-insecure-localhost: false

# Keep enabled everywhere players access the real server. The local test harness
# explicitly disables this so test clients can join without the Discord bot.
verification-required: true
verification-expiry-seconds: 600
reconnect-max-seconds: 60

# Marks a player AFK after this much real inactivity. Block movement is used so
# Geyser camera jitter cannot keep a Bedrock player active forever.
afk-timeout-seconds: 300

# AFK players take no damage. A hit from another player wakes them instead of
# bouncing off, so /afk cannot be pressed as a shield mid-fight, and the void
# still kills — cancelling it would strand them under the world.
afk-invincible: true

# How long a fight holds on to a player. While held, /afk is refused and the idle
# sweep will not mark them AFK, because either would hand them the invincibility
# above in the middle of a fight. Covers mobs too, so an airdrop garrison cannot
# be waited out from inside an AFK shield.
afk-combat-tag-seconds: 15

# How far /mgxadmin abuse reaches when the operator does not name a radius.
# Events run at spawn, so this deliberately does not cover the whole server:
# somebody at a farm or an AFK chamber should never learn one happened. AFK
# players inside the radius are skipped too, and so is anybody in a vehicle
# for the effects that move people.
abuse-radius: 64

# Show the NEW UPDATE banner automatically when the dev blog publishes a new
# post, rather than waiting for /mgxadmin update. The banner sends players to
# the blog, so the blog is what decides when it appears — a plugin release with
# nothing new to read should not send anybody anywhere.
#
# The site writes latest.json naming its newest post; this polls that. Leave
# blog-latest-url empty to switch the watcher off and go back to /mgxadmin update.
auto-update-notice: true
blog-latest-url: "https://mysterioussmpx.blog/latest.json"
blog-poll-minutes: 5

# The sidebar refreshes live player, level, heart, clan, combat, and server data.
# 100 ticks (5s) keeps ping/TPS current without rebuilding every scoreboard each second.
scoreboard:
  footer: "discord.gg/mgx"
  update-ticks: 100

# Rebuild standings every five minutes. Statistics are read asynchronously and unchanged
# files are cached, so this keeps Discord current without creating unnecessary disk load.
leaderboard:
  refresh-ticks: 6000

# The shared Amethyst event scheduler alternates Airdrops and Huge Blocks. Its
# randomized cooldown starts only after an event ends, so events never overlap or
# spawn immediately after one another. Actual reward chances live only in the plugin.
amethyst-events:
  minimum-delay-minutes: 30
  maximum-delay-minutes: 90

airdrop:
  enabled: true
  lifetime-minutes: 30
  minimum-radius: 500
  location-attempts: 24

amethyst-block-event:
  enabled: true
  lifetime-minutes: 30
  minimum-radius: 500
  location-attempts: 24

# Ordinary zombie and skeleton spawns have a one-in-five chance to become an
# Amethyst variant. Their exact key count is rolled only when they die.
amethyst-mobs:
  one-in: 5

# Random overworld teleports stay well away from spawn and inside the world border.
rtp:
  minimum-radius: 500
  maximum-radius: 25000
  attempts: 24

# The protected spawn region: 100x100 centred on the locked spawn at 0,0.
# Inside it no hostile mob spawns, hostile mobs walking in are stopped at the
# edge, blocks cannot be broken or placed by non-operators, and PvP is refused.
# Amethyst mobs are exempt from the mob rules so an airdrop garrison can still
# stand its ground here. Bounds are inclusive, so -50..49 is exactly 100 wide.
spawn:
  protection:
    enabled: true
    min-x: -50
    max-x: 49
    min-z: -50
    max-z: 49

# Reduces active world chunk load. 0 on a distance leaves the panel value unchanged.
# border-radius is blocks from spawn (nether is 1/8). Set -1 to leave the panel border.
world:
  max-view-distance: 6
  max-simulation-distance: 4
  border-radius: 100000

# What the server reports to the Discord activity log.
#
# Everything reports unless it is switched off here, so a topic added to a later
# build starts reporting on a server that already has this file - an allow list
# would leave it silent and nobody would notice. Discord decides which channel
# each topic is written to and can mute one outright; this decides whether the
# server bothers saying it at all.
#
# High-rate topics are counted per player rather than sent one at a time: ore
# blocks and ordinary mob kills arrive as a single tally every flush-minutes,
# while player kills, deaths, boss kills and diamond-tier finds are sent the
# moment they happen. Lowering flush-minutes makes the log chattier, not more
# detailed. A player who logs out is flushed straight away.
activity-log:
  flush-minutes: 5
  topics:
    combat: true
    mining: true
    crate: true
    progression: true
    cosmetic: true
    clan: true
    economy: true
    staff: true
    admin: true

debug: false
