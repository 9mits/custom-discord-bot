name: Dev Blog

on:
  push:
    branches: ["main"]
    paths: ["devblog/**", ".github/workflows/devblog.yml"]
  pull_request:
    branches: ["main"]
    paths: ["devblog/**", ".github/workflows/devblog.yml"]
  workflow_dispatch:
  # Refresh the live server figures on the home page. The build is ~40s, so five
  # minutes - the shortest interval GitHub schedules - is affordable, and the page
  # itself re-reads assets/stats.json every minute, so an open tab picks a new
  # build up without a reload. GitHub may still skip runs when the repo is quiet,
  # which only means the numbers age rather than break: the page prints when they
  # were checked.
  schedule:
    - cron: "*/5 * * * *"

# Allow one deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: "devblog-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r devblog/requirements.txt pyflakes

      - name: Lint
        run: python3 -m pyflakes devblog/

      - name: Tests
        run: python3 devblog/tests/test_build.py

      - name: Fetch live server stats
        # The address is private and never leaves this step: server_status.py
        # writes counts and a timestamp only, and devblog/data/ is git-ignored.
        # A failure here is not fatal — the stats panel simply does not render.
        env:
          MC_SERVER_HOST: ${{ secrets.MC_SERVER_HOST }}
          MC_SERVER_PORT: ${{ secrets.MC_SERVER_PORT }}
        run: python3 devblog/server_status.py

      - name: Build site
        env:
          # Set the repo variable DEVBLOG_SITE_URL once a custom domain is live.
          DEVBLOG_SITE_URL: ${{ vars.DEVBLOG_SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: python3 devblog/build.py

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: devblog/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
